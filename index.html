<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SN 查询</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SN 查询" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "@scandit/web-datacapture-core": "https://cdn.jsdelivr.net/npm/@scandit/web-datacapture-core@8/build/js/index.js",
        "@scandit/web-datacapture-barcode": "https://cdn.jsdelivr.net/npm/@scandit/web-datacapture-barcode@8/build/js/index.js"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header>
      <h1>SN 查询</h1>
      <p id="dataStatus">正在载入数据…</p>
    </header>

    <section class="card scanner-card">
      <div id="scanIdle" class="scan-idle">
        <div class="scan-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 16V9a3 3 0 0 1 3-3h7" />
            <path d="M32 6h7a3 3 0 0 1 3 3v7" />
            <path d="M42 32v7a3 3 0 0 1-3 3h-7" />
            <path d="M16 42H9a3 3 0 0 1-3-3v-7" />
            <path d="M14 24h20" />
          </svg>
        </div>
        <p class="scan-title">扫描产品二维码</p>
        <p class="scan-sub">支持激光点阵 DataMatrix、二维码、一维条码，识别 SN 后自动查询</p>
        <button id="startBtn" class="btn primary">开始扫描</button>
      </div>

      <div id="scanActive" class="scan-active" hidden>
        <video id="video" playsinline autoplay muted></video>
        <div id="scanditView" class="scandit-view" hidden></div>
        <div class="scan-overlay" aria-hidden="true">
          <div class="scan-frame"><span class="scan-line"></span></div>
        </div>
        <button id="stopBtn" class="btn ghost stop-btn">停止扫描</button>
      </div>

      <p id="scanError" class="error" hidden></p>
    </section>

    <section class="card manual-card">
      <label for="manualInput">手动输入 SN</label>
      <div class="input-row">
        <input id="manualInput" type="text" inputmode="text" autocomplete="off"
               autocapitalize="characters" spellcheck="false" placeholder="例如 FJS0000123456789" />
        <button id="lookupBtn" class="btn secondary">查询</button>
      </div>
    </section>

    <section class="card import-card">
      <div class="import-head">
        <div>
          <p class="import-title">数据更新</p>
          <p class="import-sub">导入 CSV（需含 SN 列）覆盖本机数据，仅保存在此设备</p>
        </div>
        <label id="importBtn" class="btn secondary" for="csvFile">导入 CSV</label>
      </div>
      <input id="csvFile" class="visually-hidden" type="file" accept=".csv,text/csv" />
      <p id="importMsg" class="import-msg" hidden></p>
      <button id="restoreBtn" class="link-btn" hidden>恢复内置数据</button>
    </section>

    <section class="card import-card">
      <div class="import-head">
        <div>
          <p class="import-title">扫码引擎</p>
          <p id="engineStatus" class="import-sub">检测中…</p>
        </div>
        <button id="engineToggle" class="btn secondary">设置</button>
      </div>
      <div id="engineForm" hidden>
        <input id="licenseInput" class="key-input" type="text" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="粘贴 Scandit license key" />
        <button id="licenseSave" class="btn primary">保存并启用</button>
        <p class="import-sub">未设置时会自动使用内置开源解码（激光点阵码可能识别不到）。</p>
      </div>
      <p id="engineMsg" class="import-msg" hidden></p>
    </section>
  </div>

  <div id="resultOverlay" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <span id="resultBadge" class="badge">已找到</span>
        <button id="closeResult" class="icon-btn" aria-label="关闭">×</button>
      </div>
      <p id="snLabel" class="sn-label">SN</p>
      <h2 id="resultSn" class="sn-value"></h2>
      <dl id="resultFields" class="fields"></dl>
      <p id="resultHint" class="hint" hidden>该 SN 不在数据表中，请核对二维码或数据。</p>
      <p id="rawContent" class="raw" hidden></p>
      <button id="rescanBtn" class="btn primary">继续扫描</button>
    </div>
  </div>

  <script src="vendor/jsQR.js"></script>
  <script src="vendor/zxing.min.js"></script>
  <script src="csv-import.js"></script>
  <script src="app.js"></script>
  <script type="module" src="scandit-scan.js"></script>
</body>
</html>
